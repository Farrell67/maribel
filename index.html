<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spinning Bouquet</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const SPIN_SPEED = 0.6, TILT = 0.30, CAM_DIST = 4.0, NUM_HEARTS = 18;
const MESSAGE = "for maribel (:";
const HINT = "";
const PIVOT_Y = 0.2;

// all flowers are black (near-black grays so the shading stays visible on the black background)
const BLACK_PETAL = [234, 236, 238, 240, 242, 245];
const BLACK_CENTER = [232, 234, 236, 238, 240];
const WHITE = BLACK_PETAL, PINK = BLACK_PETAL, RED = BLACK_PETAL;
const PURPLE = BLACK_PETAL, YELLOW = BLACK_PETAL, ORANGE = BLACK_PETAL;
const GOLD_CENTER = BLACK_CENTER, DARK_CENTER = BLACK_CENTER;
const GREENS = [22, 28, 28, 34, 35, 71, 77, 114];
const PAPER = [101, 144, 187, 223, 230, 231];
const RIBBON = [88, 125, 161, 197, 204, 211];
const HEART_COLORS = [161, 197, 204, 205, 211, 218];
const MSG_COLORS = [161, 168, 205, 211, 218, 225, 218, 211, 205, 168];
const SHADE = ".:-=+*%@";
const PETAL_SHADE = "+*#%";

const _L = [-0.45, 0.6, 0.66];
const _n = Math.hypot(..._L);
const [LX, LY, LZ] = _L.map(v => v / _n);

const DISC_TYPES = [
  [WHITE, GOLD_CENTER, 13], [PINK, GOLD_CENTER, 8], [RED, DARK_CENTER, 6],
  [PURPLE, GOLD_CENTER, 7], [YELLOW, DARK_CENTER, 12], [ORANGE, DARK_CENTER, 9],
];
const TULIP_COLORS = [RED, PINK, YELLOW];

// ---- xterm 256-color -> CSS ----
const CUBE = [0, 95, 135, 175, 215, 255];
const STD = ["#000","#800000","#008000","#808000","#000080","#800080","#008080","#c0c0c0",
             "#808080","#f00","#0f0","#ff0","#00f","#f0f","#0ff","#fff"];
const COLOR_CACHE = [];
function css256(n) {
  if (COLOR_CACHE[n]) return COLOR_CACHE[n];
  let c;
  if (n < 16) c = STD[n];
  else if (n < 232) {
    const i = n - 16;
    c = `rgb(${CUBE[Math.floor(i / 36)]},${CUBE[Math.floor(i / 6) % 6]},${CUBE[i % 6]})`;
  } else { const g = 8 + 10 * (n - 232); c = `rgb(${g},${g},${g})`; }
  return (COLOR_CACHE[n] = c);
}

// ---- seeded RNG (stand-in for Python's Random(21)) ----
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rndSeed = mulberry32(21);
const rnd = { random: rndSeed, uniform: (a, b) => a + (b - a) * rndSeed() };

// ---- vector helpers ----
const norm = v => { const m = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / m, v[1] / m, v[2] / m]; };
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const add = (p, d, k) => [p[0] + d[0] * k, p[1] + d[1] * k, p[2] + d[2] * k];

function buildScene() {
  const pts = [];
  const neck = [0, -0.12, 0];
  const C = [0, 0.12, 0], D = 0.64, N = 10;
  const golden = Math.PI * (3 - Math.sqrt(5));
  const heads = [];
  for (let i = 0; i < N; i++) {
    const el = (88 - 60 * Math.sqrt(i / (N - 1))) * Math.PI / 180;
    const az = i * golden;
    const d = [Math.cos(el) * Math.cos(az), Math.sin(el), Math.cos(el) * Math.sin(az)];
    heads.push([add(C, d, D * rnd.uniform(0.92, 1.05)), norm(d)]);
  }

  const tulipSlots = new Set([3, 8]);
  const flowers = [];
  let discI = 0;
  heads.forEach(([pos, axis], idx) => {
    const base = add(pos, axis, -0.03);
    for (let j = 0; j < 70; j++) {
      const t = j / 69;
      const p = [base[0] + (neck[0] - base[0]) * t, base[1] + (neck[1] - base[1]) * t,
                 base[2] + (neck[2] - base[2]) * t];
      pts.push([p[0], p[1], p[2], axis[0], 0, axis[2], GREENS, -0.15, true, null]);
    }
    if (tulipSlots.has(idx)) {
      let nT = 0; tulipSlots.forEach(k => { if (k < idx) nT++; });
      flowers.push({ pos, kind: "tulip", pal: TULIP_COLORS[nT % TULIP_COLORS.length], cpal: null,
                     nPet: 0, R: 0.11, seed: rnd.uniform(0, 6.28) });
    } else {
      const [petals, center, nPet] = DISC_TYPES[discI % DISC_TYPES.length];
      discI++;
      flowers.push({ pos, kind: "disc", pal: petals, cpal: center, nPet,
                     R: rnd.uniform(0.12, 0.14), seed: rnd.uniform(0, 6.28) });
    }
  });

  // leaves
  for (let i = 0; i < 8; i++) {
    const a = (i + 0.4) / 8 * 2 * Math.PI;
    const c = Math.cos(a), s = Math.sin(a);
    const base = [0.26 * c, 0.30, 0.26 * s];
    const d = norm([c, 0.15, s]);
    const side = [-s, 0, c];
    const n = norm(cross(side, d));
    const L = 0.30, W = 0.07;
    for (let ti = 0; ti < 32; ti++) {
      const t = ti / 31;
      for (let wi = -5; wi <= 5; wi++) {
        const w = wi / 5, curl = 0.025 * w * w;
        const sw = W * Math.sin(Math.PI * t) * w;
        pts.push([
          base[0] + d[0] * L * t + side[0] * sw + n[0] * curl,
          base[1] + d[1] * L * t - 0.10 * t * t + n[1] * curl,
          base[2] + d[2] * L * t + side[2] * sw + n[2] * curl,
          n[0], n[1], n[2], GREENS, wi === 0 ? -0.25 : 0, true, null]);
      }
    }
  }

  // paper cone
  const y0 = -0.20, y1 = 0.30, r0 = 0.06, r1 = 0.36;
  const k = (r1 - r0) / (y1 - y0);
  const rings = 50;
  for (let i = 0; i < rings; i++) {
    const t = i / (rings - 1);
    const r = r0 + (r1 - r0) * t;
    const count = Math.max(8, Math.floor(170 * r));
    for (let j = 0; j < count; j++) {
      const ph = (j + rnd.random()) / count * 2 * Math.PI;
      const c = Math.cos(ph), s = Math.sin(ph);
      let y = y0 + (y1 - y0) * t;
      if (t > 0.9) y += 0.03 * Math.sin(9 * ph);
      const fold = 0.3 * (Math.abs(Math.sin(5 * ph)) - 0.6);
      const nn = norm([c, -k, s]);
      pts.push([r * c, y, r * s, nn[0], nn[1], nn[2], PAPER, fold, false, null]);
    }
  }

  // stem tips below cone
  for (let i = 0; i < 7; i++) {
    const a = i / 7 * 2 * Math.PI;
    const sx = 0.025 * Math.cos(a), sz = 0.025 * Math.sin(a);
    for (let j = 0; j < 40; j++) {
      const t = j / 39;
      pts.push([sx * (1 + 1.2 * t), -0.20 - 0.30 * t, sz * (1 + 1.2 * t),
                Math.cos(a), 0, Math.sin(a), GREENS, -0.1, true, null]);
    }
  }

  // ribbon + bow
  const by = -0.12;
  const br = r0 + k * (by - y0) + 0.01;
  for (let j = 0; j < 90; j++) {
    const ph = j / 90 * 2 * Math.PI;
    for (const dy of [-0.012, 0, 0.012])
      pts.push([br * Math.cos(ph), by + dy, br * Math.sin(ph),
                Math.cos(ph), 0, Math.sin(ph), RIBBON, 0, false, null]);
  }
  const knot = [0, by, br + 0.01];
  for (const side of [-1, 1]) {
    for (let j = 0; j < 70; j++) {
      const a = j / 70 * 2 * Math.PI;
      const lx = side * (0.07 + 0.07 * Math.cos(a));
      const ly = 0.04 * Math.sin(a) + 0.02 * (0.07 + 0.07 * Math.cos(a)) / 0.14;
      for (const fill of [1.0, 0.7])
        pts.push([knot[0] + lx * fill, knot[1] + ly * fill, knot[2] + 0.01,
                  side * 0.3, 0.2, 0.93, RIBBON, 0.1, true, null]);
    }
    for (let j = 0; j < 30; j++) {
      const t = j / 29;
      pts.push([knot[0] + side * 0.06 * t, knot[1] - 0.15 * t, knot[2] + 0.015,
                side * 0.2, 0, 0.98, RIBBON, -0.05 + 0.05 * Math.sin(t * 9), true, null]);
    }
  }
  for (const dx of [-0.01, 0, 0.01])
    pts.push([dx, by, knot[2] + 0.02, 0, 0, 1, RIBBON, 0.2, true, "@"]);

  // baby's breath
  const babies = [];
  for (let i = 0; i < 90; i++) {
    const a = rnd.random() * 2 * Math.PI;
    const el = rnd.uniform(0.3, 1.4);
    const rr = rnd.uniform(0.40, 0.58);
    babies.push([rr * Math.cos(a) * Math.cos(el), C[1] + rr * Math.sin(el),
                 rr * Math.sin(a) * Math.cos(el), rnd.uniform(0, 6.28)]);
  }

  const sparkles = [];
  for (let i = 0; i < 30; i++) {
    const a = rnd.random() * 2 * Math.PI;
    const rr = rnd.uniform(0.75, 0.95);
    sparkles.push([rr * Math.cos(a), rnd.uniform(-0.3, 1.0), rr * Math.sin(a),
                   rnd.uniform(0, 6.28), rnd.uniform(1.5, 4.0)]);
  }
  return { pts, flowers, babies, sparkles };
}

const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function updateHearts(hearts, dt) {
  while (hearts.length < NUM_HEARTS)
    hearts.push([Math.random(), 1 + Math.random(), 0.03 + Math.random() * 0.05,
                 Math.random() * 6.28, pick(HEART_COLORS)]);
  for (const h of hearts) {
    h[1] -= h[2] * dt;
    if (h[1] < 0) { h[0] = Math.random(); h[1] = 1; h[4] = pick(HEART_COLORS); }
  }
}

function render(scene, t, cols, rows, hearts) {
  const { pts, flowers, babies, sparkles } = scene;
  const chars = Array.from({ length: rows }, () => new Array(cols).fill(" "));
  const colors = Array.from({ length: rows }, () => new Array(cols).fill(0));
  const zbuf = Array.from({ length: rows }, () => new Float64Array(cols).fill(-1e9));

  const viewRows = rows;
  const scale = Math.max(1, Math.min((viewRows - 2) / 1.45, (cols - 2) / 2.7));
  const sxScale = scale * 2;
  const cx = cols / 2, cy = 1 + 0.78 * scale;

  const ang = t * SPIN_SPEED;
  const ca = Math.cos(ang), sa = Math.sin(ang);
  const ct = Math.cos(TILT), st = Math.sin(TILT);

  function projectF(x, y, z) {
    const xr = x * ca - z * sa, zr = x * sa + z * ca;
    const yp = y - PIVOT_Y;
    const yt = yp * ct - zr * st, zt = yp * st + zr * ct;
    const f = CAM_DIST / (CAM_DIST - zt);
    return [cx + xr * f * sxScale, cy - yt * f * scale, zt, f];
  }
  function project(x, y, z) {
    const [fx, fy, zt] = projectF(x, y, z);
    return [Math.trunc(fx), Math.trunc(fy), zt];
  }
  function plot(col, row, z, ch, color) {
    if (row >= 0 && row < viewRows && col >= 0 && col < cols && z > zbuf[row][col]) {
      zbuf[row][col] = z; chars[row][col] = ch; colors[row][col] = color;
    }
  }

  for (const [x, y, , phase, color] of hearts) {
    const v = Math.trunc((x + 0.015 * Math.sin(t * 1.2 + phase)) * cols);
    plot(((v % cols) + cols) % cols, Math.trunc(y * viewRows), -50, "♥", color);
  }

  for (const [x, y, z, nx, ny, nz, pal, tone, twoSided, override] of pts) {
    const [col, row, zt] = project(x, y, z);
    const nxr = nx * ca - nz * sa, nzr = nx * sa + nz * ca;
    const nyt = ny * ct - nzr * st, nzt = ny * st + nzr * ct;
    let dot = nxr * LX + nyt * LY + nzt * LZ;
    if (twoSided && dot < 0) dot = -dot * 0.55;
    let b = 0.25 + 0.75 * Math.max(0, dot) + tone;
    b = Math.min(0.999, Math.max(0, b));
    const ch = override || SHADE[Math.floor(b * SHADE.length)];
    plot(col, row, zt, ch, pal[Math.floor(b * pal.length)]);
  }

  for (const { pos, kind, pal, cpal, nPet, R, seed } of flowers) {
    const [fx, fy, zt, f] = projectF(pos[0], pos[1], pos[2]);
    const rx = R * f * sxScale, ry = R * f * scale;
    const dim = -0.4 * (1 - Math.min(1, Math.max(0, (zt + 0.6) / 1.2)));
    const rot = seed + ang * 0.7;
    for (let row = Math.trunc(fy - ry) - 1; row <= Math.trunc(fy + ry) + 1; row++) {
      const dy = (row + 0.5 - fy) / ry;
      for (let col = Math.trunc(fx - rx) - 1; col <= Math.trunc(fx + rx) + 1; col++) {
        const dx = (col + 0.5 - fx) / rx;
        if (kind === "disc") {
          const s = Math.sqrt(dx * dx + dy * dy);
          if (s > 1) continue;
          if (s < 0.3) {
            let b = 0.55 - 0.35 * dx - 0.35 * dy + dim;
            b = Math.min(0.999, Math.max(0, b));
            plot(col, row, zt + 0.06, s < 0.17 ? "@" : "o", cpal[Math.floor(b * cpal.length)]);
            continue;
          }
          const ph = Math.atan2(dy, dx);
          const reach = 0.32 + 0.68 * Math.pow(Math.abs(Math.cos(nPet * (ph + rot) / 2)), 0.7);
          if (s > reach) continue;
          const edge = s > reach - 0.14 ? -0.22 : 0;
          let b = 0.62 - 0.22 * dx - 0.28 * dy + 0.12 * s + edge + dim;
          b = Math.min(0.999, Math.max(0, b));
          plot(col, row, zt + 0.04 * (1 - s),
               PETAL_SHADE[Math.floor(b * PETAL_SHADE.length)], pal[Math.floor(b * pal.length)]);
        } else {
          const v = (1 - dy) / 2;
          if (v < 0 || v > 1) continue;
          const hw = 0.62 * Math.sin(Math.PI * 0.5 * Math.min(1, v * 1.5 + 0.05));
          if (hw <= 0 || Math.abs(dx) > hw) continue;
          const xn = dx / hw;
          if (v > 0.72 + 0.28 * Math.pow(Math.cos(1.5 * Math.PI * xn), 2)) continue;
          const seam = (Math.abs(Math.abs(xn) - 0.33) < 0.12 && v > 0.3) ? -0.25 : 0;
          let b = 0.55 - 0.3 * xn + 0.1 * v + seam + dim;
          b = Math.min(0.999, Math.max(0, b));
          plot(col, row, zt + 0.03,
               PETAL_SHADE[Math.floor(b * PETAL_SHADE.length)], pal[Math.floor(b * pal.length)]);
        }
      }
    }
  }

  for (const [x, y, z, phase] of babies) {
    const [col, row, zt] = project(x, y, z);
    const star = Math.sin(t * 2 + phase) > 0.6;
    plot(col, row, zt + 0.02, star ? "*" : "·", star ? 231 : 255);
  }

  for (const [x, y, z, phase, speed] of sparkles) {
    const [col, row, zt] = project(x, y, z);
    const tw = Math.sin(t * speed + phase);
    if (tw > 0.85) plot(col, row, zt, "*", 231);
    else if (tw > 0.4) plot(col, row, zt, "+", 225);
    else if (tw > 0) plot(col, row, zt, "·", 218);
  }

  return { chars, colors };
}

// ---- canvas driver ----
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let fs, cw, lh, cols, rows, msgFs, msgH;
const MONO = '"SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", monospace';

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fs = Math.max(8, Math.min(16, Math.floor(innerWidth / 70)));
  ctx.font = `${fs}px "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", monospace`;
  cw = ctx.measureText("M").width;
  lh = cw * 2;                       // terminal-like 1:2 cell
  cols = Math.max(20, Math.floor(innerWidth / cw));
  // message gets its own larger font, independent of the ASCII grid
  msgFs = Math.max(20, Math.min(44, Math.floor(innerWidth / 12)));
  msgH = Math.ceil(msgFs * 2);
  rows = Math.max(12, Math.floor((innerHeight - msgH) / lh));
}
addEventListener("resize", resize);
resize();

const scene = buildScene();
const hearts = [];
let startT = performance.now(), last = startT;

function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  updateHearts(hearts, dt);
  const { chars, colors } = render(scene, (now - startT) / 1000, cols, rows, hearts);

  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, innerWidth, innerHeight);
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  let lastColor = -1;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const ch = chars[r][c];
      if (ch === " ") continue;
      const col = colors[r][c];
      if (col !== lastColor) { ctx.fillStyle = css256(col); lastColor = col; }
      ctx.fillText(ch, (c + 0.5) * cw, (r + 0.5) * lh);
    }
  }
  // big, readable message at the bottom
  ctx.font = `bold ${msgFs}px ${MONO}`;
  const mw = ctx.measureText("M").width;
  const chars2 = [...MESSAGE];
  const total = mw * chars2.length;
  const x0 = (innerWidth - total) / 2;
  const shift = Math.floor(((now - startT) / 1000) * 6);
  const my = innerHeight - msgH / 2;
  chars2.forEach((ch, i) => {
    ctx.fillStyle = css256(MSG_COLORS[(i + shift) % MSG_COLORS.length]);
    ctx.fillText(ch, x0 + (i + 0.5) * mw, my);
  });
  ctx.font = `${fs}px ${MONO}`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
